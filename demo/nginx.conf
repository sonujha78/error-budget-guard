worker_processes 1;
events { worker_connections 1024; }
http {
  # One JSON object per request. path is the full request uri on purpose, and client_ip, user_id
  # and cookie are logged on purpose: ebg must drop them, and that is checked on this very file.
  log_format ebgjson escape=json '{"ts":$msec,"service":"demo","path":"$request_uri","status":$status,"latency_s":$request_time,"request_id":"$request_id","client_ip":"$remote_addr","user_id":"$http_x_user_id","cookie":"$http_cookie"}';
  access_log /var/log/ebg/access.log ebgjson;

  upstream app { server ebg-app:8080; keepalive 32; }
  server {
    listen 80;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://app;
    }
  }
}
