# Error Budget Guard demo. Everything is named ebg-*, ports bind to 127.0.0.1 only.
# EBG_OUT is the directory that receives access.log (nginx) and truth.json (load generator).
name: ebg-demo
services:
  ebg-app:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    image: ebg-demo:local
    container_name: ebg-app
    entrypoint: ["/usr/local/bin/ebg-demoapp"]
    command: ["-addr", ":8080"]
    ports:
      - "127.0.0.1:19081:8080"

  ebg-nginx:
    image: nginx:1.27-alpine
    container_name: ebg-nginx
    depends_on: [ebg-app]
    ports:
      - "127.0.0.1:19080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${EBG_OUT:-../out/demo}:/var/log/ebg

  ebg-loadgen:
    image: ebg-demo:local
    pull_policy: never
    profiles: ["load"]
    depends_on: [ebg-nginx]
    entrypoint: ["/usr/local/bin/ebg-loadgen"]
    volumes:
      - ../scenarios:/scenarios:ro
      - ${EBG_OUT:-../out/demo}:/out
