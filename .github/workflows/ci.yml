name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build -o bin/ebg ./cmd/ebg
      - name: Recorded scenarios give the expected alerts and gate decisions
        run: ./bin/ebg verify scenarios/*
      - name: Reports are reproducible from the recorded data
        run: |
          ./scripts/make-reports.sh
          test -z "$(git status --porcelain -- scenarios)" || { git status --short -- scenarios; exit 1; }
